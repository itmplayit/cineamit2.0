{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-[#09090b] px-4">
    <div class="bg-[#141519] p-8 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-md text-center animate-fade-in will-change-transform">
        <i class="fa-solid fa-envelope-open-text text-5xl text-purple-600 mb-4" aria-hidden="true"></i>
        <h2 class="text-2xl font-black text-white mb-2 tracking-wide">Forgot Password?</h2>
        <p class="text-gray-400 text-sm mb-6 leading-relaxed">Enter the email address associated with your account and we'll send you a 6-digit verification code.</p>

        <form method="POST" action="{{ url_for('routes.forgot_password') }}" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="email" name="email" id="email" required autocomplete="email" aria-label="Email Address"
                   value="{{ entered_email|default('') }}"
                   placeholder="Enter your email"
                   class="w-full bg-[#0a0a0c] border border-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:border-purple-500 transition-colors shadow-inner">
            <button type="submit" aria-label="Send Verification Code"
                    class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg transition-colors shadow-[0_0_15px_rgba(147,51,234,0.4)] cursor-pointer">
                Send Code
            </button>
        </form>

        <p class="mt-6 text-sm text-gray-500">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" aria-label="Create an account" class="text-purple-400 hover:text-purple-300 transition-colors font-bold">Sign up</a>
        </p>
        <p class="mt-2 text-sm text-gray-500">
            <a href="{{ url_for('auth.login') }}" aria-label="Back to Login" class="hover:text-purple-400 transition-colors font-bold">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
