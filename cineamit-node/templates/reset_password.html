{% extends "base.html" %}
{% block content %}
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in { opacity: 0; animation: fadeIn 0.4s ease-out forwards; will-change: transform, opacity; }
</style>
<div class="min-h-screen flex items-center justify-center bg-[#09090b] px-4 animate-fade-in">
    <div class="bg-[#141519] p-8 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-md text-center">
        <i class="fa-solid fa-lock text-5xl text-red-600 mb-4" aria-hidden="true"></i>
        <h2 class="text-2xl font-black text-white mb-2 tracking-wide">Set New Password</h2>
        <p class="text-gray-400 text-sm mb-6 leading-relaxed">Code verified. Your new password must be at least 8 characters with letters and numbers.</p>

        <form method="POST" action="{{ url_for('routes.reset_password') }}" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="relative">
                <input type="password" name="password" id="pw1" required minlength="8" aria-label="New Password" autocomplete="new-password" placeholder="Enter new password (min. 8 chars)"
                    class="w-full bg-[#0a0a0c] border border-gray-700 text-white rounded-lg px-4 py-3 pr-11 outline-none focus:border-red-500 transition-colors shadow-inner">
                <button type="button" data-toggle="pw1" aria-label="Show password"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 cursor-pointer bg-transparent border-0">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <div class="relative">
                <input type="password" name="confirm_password" id="pw2" required minlength="8" aria-label="Confirm Password" autocomplete="new-password" placeholder="Confirm new password"
                    class="w-full bg-[#0a0a0c] border border-gray-700 text-white rounded-lg px-4 py-3 pr-11 outline-none focus:border-red-500 transition-colors shadow-inner">
                <button type="button" data-toggle="pw2" aria-label="Show password"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 cursor-pointer bg-transparent border-0">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <p id="matchMsg" class="text-xs text-left h-4 text-gray-500"></p>

            <button type="submit" aria-label="Update Password"
                class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg transition-colors shadow-[0_0_15px_rgba(220,38,38,0.4)] cursor-pointer">
                Update Password
            </button>
        </form>

        <p class="mt-6 text-sm text-gray-500">
            <a href="/login" class="hover:text-red-400 transition-colors font-bold">Back to Login</a>
        </p>
    </div>
</div>

<script>
(function () {
  document.querySelectorAll('[data-toggle]').forEach(function (b) {
    b.addEventListener('click', function () {
      var inp = document.getElementById(b.getAttribute('data-toggle'));
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.innerHTML = show ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
    });
  });

  var p1 = document.getElementById('pw1'), p2 = document.getElementById('pw2'), msg = document.getElementById('matchMsg');
  function check() {
    if (!p2.value) { msg.textContent = ''; return; }
    var ok = p1.value === p2.value;
    msg.textContent = ok ? 'Passwords match' : 'Passwords do not match';
    msg.className = 'text-xs text-left h-4 ' + (ok ? 'text-green-500' : 'text-red-500');
  }
  p1.addEventListener('input', check); p2.addEventListener('input', check);
})();
</script>
{% endblock %}
