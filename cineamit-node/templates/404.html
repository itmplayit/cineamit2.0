{% extends "base.html" %}
{% block title %}404 Page Not Found - CINEAMIT{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center px-6 py-20 text-center bg-[#0f1014]">
    <div class="w-24 h-24 rounded-full bg-red-600/10 border border-red-600/30 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(220,38,38,0.2)]">
        <i class="fa-solid fa-film text-4xl text-red-500"></i>
    </div>
    <h1 class="text-6xl md:text-8xl font-black text-white tracking-tight mb-2">404</h1>
    <h2 class="text-xl md:text-2xl font-bold text-gray-200 mb-4">Scene Not Found</h2>
    <p class="text-gray-400 text-sm md:text-base max-w-md mb-8 leading-relaxed">
        The movie, show, or page you are looking for might have been moved, removed, or never existed.
    </p>
    <div class="flex flex-wrap items-center justify-center gap-4">
        <a href="/" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-[0_0_20px_rgba(220,38,38,0.4)] flex items-center gap-2">
            <i class="fa-solid fa-house text-xs"></i> Back to Home
        </a>
        <a href="/movies" class="bg-[#141519] hover:bg-gray-800 text-gray-200 border border-gray-700 font-bold px-6 py-3 rounded-xl transition-all flex items-center gap-2">
            <i class="fa-solid fa-clapperboard text-xs"></i> Browse Movies
        </a>
    </div>
</div>
{% endblock %}
