    <script>
        (function () {
            function fixTmdbImage(img) {
                if (!img || img.dataset.tmdbMirrorTried === '1') return;
                const source = img.currentSrc || img.getAttribute('src') || '';
                let imageUrl;
                try {
                    imageUrl = new URL(source, document.baseURI);
                } catch (_) {
                    return;
                }
                const localTmdbPath = /^\/(?:original|w\d+|h\d+|face)\/[^/]+\.(?:jpe?g|png|webp)$/i.test(imageUrl.pathname);
                const isLocalBrokenTmdbPath = imageUrl.origin === location.origin && localTmdbPath;
                const isTmdbImage = imageUrl.protocol === 'https:' && imageUrl.hostname.toLowerCase() === 'image.tmdb.org';
                const incompleteTmdb = isTmdbImage && /^\/t\/p\/(?:original|w\d+|h\d+|face)\/?$/i.test(imageUrl.pathname);
                const missingSize = isTmdbImage ? imageUrl.pathname.match(/^\/t\/p\/([^/]+\.(?:jpe?g|png|webp))$/i) : null;
                if (!isLocalBrokenTmdbPath && !isTmdbImage) return;
                const picture = img.closest('picture');
                if (picture) picture.querySelectorAll('source[srcset]').forEach(sourceNode => sourceNode.removeAttribute('srcset'));
                img.removeAttribute('srcset');
                if (incompleteTmdb) {
                    img.dataset.tmdbMirrorTried = '1';
                    img.removeAttribute('crossorigin');
                    img.src = '/static/logo-192.png';
                    return;
                }
                if (isLocalBrokenTmdbPath) {
                    img.src = 'https://image.tmdb.org/t/p' + imageUrl.pathname + imageUrl.search;
                    return;
                }
                if (missingSize) {
                    img.src = 'https://image.tmdb.org/t/p/w500/' + missingSize[1] + imageUrl.search;
                    return;
                }
                img.dataset.tmdbMirrorTried = '1';
                img.removeAttribute('crossorigin');
                img.src = 'https://images.weserv.nl/?url=' + encodeURIComponent(imageUrl.host + imageUrl.pathname + imageUrl.search);
            }
            document.addEventListener('error', event => {
                const img = event.target;
                if (img && img.tagName === 'IMG') fixTmdbImage(img);
            }, true);
        })();
    </script>
