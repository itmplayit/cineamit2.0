{% if splash_enabled is not defined or splash_enabled %}
{# CINE-SPLASH:HTML:START #}
<!-- CINEAMIT build: boot-screen=v1.1 | SPLASH_ENABLED={{ (splash_enabled is not defined or splash_enabled) ? '1' : '0' }} -->
<div id="cine-boot" role="status" aria-live="polite" aria-label="Loading CineAmit" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:10050;background-color:#0f1014">
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Loading CINEAMIT</span>
    <div class="cb-stage" id="cine-boot-stage">
        <div class="cb-glow" aria-hidden="true"></div>
        <div class="cb-ring" aria-hidden="true"></div>
        <img class="cb-logo" id="cine-boot-logo" src="/static/assets/logo-192.png"
             srcset="/static/assets/logo-192.png 192w, /static/assets/logo-512.png 512w" sizes="180px"
             width="180" height="180" alt="CINEAMIT" fetchpriority="high" decoding="async"
             onerror="this.onerror=null;this.removeAttribute('srcset');this.src='/static/logo-192.png';">
    </div>
    <div class="cb-bar" aria-hidden="true"><span class="cb-fill" id="cine-boot-fill"></span></div>
</div>
<script id="cineBootScript">
(function () {
    var el = document.getElementById('cine-boot');
    if (!el) return;
    var fill = document.getElementById('cine-boot-fill');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var MIN = 0;    // No artificial delay; dismiss when the DOM is ready.
    var MAX = 900;  // safety: itne ms par zabardasti hata do (slow ad/iframe user ko na phansaye)
    var t0 = Date.now(), pct = 8, finished = false, trickle = null;
    var DEBUG = /[?&](?:splashdebug|bootdebug)=1/.test(location.search);
    window.__cineBoot = 'pending';

    function log(m) { if (DEBUG && window.console && console.log) console.log('[CINEAMIT boot] ' + m); }
    function setPct(p) { pct = p; if (fill) fill.style.width = p + '%'; }
    function clearTrickle() { if (trickle) { clearInterval(trickle); trickle = null; } }
    function gone() { clearTrickle(); finished = true; el.setAttribute('aria-hidden', 'true'); el.classList.add('cb-gone'); }
    function dismiss(instant) {
        if (finished) return;
        finished = true;
        clearTrickle();
        var wait = instant ? 0 : Math.max(0, MIN - (Date.now() - t0));
        window.__cineBoot = 'dismissed';
        log('dismissed (instant=' + !!instant + ') after ' + (Date.now() - t0) + 'ms, wait=' + wait + 'ms');
        setTimeout(function () {
            el.setAttribute('aria-hidden', 'true');
            el.classList.add('cb-out');
            setTimeout(function () { el.classList.add('cb-gone'); }, 340);
        }, wait);
    }

    if (/[?&]nosplash=1/.test(location.search)) { gone(); return; }

    window.__cineBoot = 'shown';
    log('shown | readyState=' + document.readyState + ' | MIN=' + MIN + 'ms MAX=' + MAX + 'ms'
        + ' | element visible: ' + (getComputedStyle(el).display !== 'none'));

    setPct(8);
    trickle = setInterval(function () {
        if (finished || pct >= 84) return;
        setPct(Math.min(84, pct + (pct < 45 ? 9 : (pct < 68 ? 5 : 2))));
    }, 170);

    function onReady() { setPct(100); dismiss(true); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', onReady); } else { onReady(); }
    window.addEventListener('DOMContentLoaded', function () { log('DOMContentLoaded -> dismiss'); });

    function onLoad() { setPct(100); log('window.load -> 100%'); setTimeout(function () { dismiss(false); }, 170); }
    if (document.readyState === 'complete') { onLoad(); } else { window.addEventListener('load', onLoad); }

    setTimeout(function () { setPct(100); log('MAX timeout hit'); dismiss(true); }, MAX);

    /* Skip: sirf asli user gesture par (click / tap / key).
       NOTE: 'scroll' aur 'wheel' jaan-boojhkar nahi hain — browser reload par scroll-restoration
       turant ek scroll event fire karta hai, jisse boot screen turant gayab ho jata tha. */
    ['click', 'pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, function () { log('skip gesture: ' + ev); dismiss(true); }, { passive: true, once: true });
    });

    /* back-forward cache se wapas aane par dobara boot screen na dikhe */
    window.addEventListener('pageshow', function (e) { if (e.persisted) gone(); });
})();
</script>
{# CINE-SPLASH:HTML:END #}
{% endif %}
{% if cursor_enabled is not defined or cursor_enabled %}
{# CINE-CURSOR:HTML:START #}
<!-- CINEAMIT build: custom-cursor=v1.2 | CURSOR_ENABLED={{ (cursor_enabled is not defined or cursor_enabled) ? '1' : '0' }} -->
<script id="cineCursorScript">
(function () {
    var html = document.documentElement;
    if (!window.matchMedia) return;
    /* Sirf mouse/trackpad wale devices par — mobile/touch par kuch nahi (wahan cursor hota hi nahi). */
    if (!matchMedia('(pointer: fine)').matches) return;
    if (/[?&]nocursor=1/.test(location.search)) return;   // debug: URL se off
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DEBUG = /[?&]cursordebug=1/.test(location.search);
    function log(m) { if (DEBUG && window.console && console.log) console.log('[CINEAMIT cursor] ' + m); }

    var EXEMPT = 'select, option, input[type="color"], iframe';
    var NO = ':disabled, .cursor-not-allowed, [aria-disabled="true"]';
    var TEXT = 'input:not([type]), input[type="text"], input[type="email"], input[type="password"], '
             + 'input[type="search"], input[type="url"], input[type="tel"], input[type="number"], '
             + 'textarea, [contenteditable=""], [contenteditable="true"]';
    var RANGE = 'input[type="range"], .dplayer-bar-wrap, .dplayer-thumb';
    var VIDEO_ZONE = 'video, #videoPlayerContainer, #videoPreRollOverlay, [data-cine-player]';
    var INTERACTIVE = 'a[href], button, [role="button"], .cursor-pointer, summary, label, select, '
             + 'input[type="submit"], input[type="button"], input[type="checkbox"], input[type="radio"], '
             + '.dplayer-icon, .dplayer-menu-toggle, [onclick], [data-action], [tabindex]:not([tabindex="-1"])';
    var MAGNET_STRENGTH = 0.35, MAGNET_MAX = 16, MAGNET_W = 320, MAGNET_H = 140;

    var dot = document.createElement('div');
    dot.id = 'ccDot'; dot.setAttribute('aria-hidden', 'true');
    dot.innerHTML = '<span class="ccv"></span>';
    var ring = document.createElement('div');
    ring.id = 'ccRing'; ring.setAttribute('aria-hidden', 'true');
    ring.innerHTML = '<span class="ccv"></span><span class="ccp"></span>';
    (document.body || html).appendChild(ring);
    (document.body || html).appendChild(dot);

    var x = -100, y = -100, rx = -100, ry = -100, mx = 0, my = 0, magnetOn = false, raf = null, live = false, lastTarget = null, state = '';
    window.__cineCursor = 'ready';
    log('ready | reduce=' + reduce);

    function stateFor(el) {
        if (!el || el.nodeType !== 1 || !el.closest) return '';
        if (el.closest(EXEMPT)) return 'cc-pause';      // native cursor ko kaam karne do (dropdown, color picker, iframe/ads)
        if (el.closest(NO)) return 'cc-no';
        if (el.closest(RANGE)) return 'cc-range';       // seek bar -> patli horizontal bar
        if (el.closest(TEXT)) return 'cc-text';
        var onVideo = !!el.closest(VIDEO_ZONE);
        // player ke control buttons hover-state rakhein, par video khud player-state
        if (!onVideo && el.closest(INTERACTIVE)) return 'cc-hover';
        if (onVideo) return 'cc-player';
        return '';
    }
    /* Magnetic snap: chhote interactive element par ring uske center ki taraf khinchti hai. */
    function magnetFor(el) {
        if (reduce || !el || !el.closest) return null;
        var t = el.closest(INTERACTIVE);
        if (!t || !t.getBoundingClientRect) return null;
        var r = t.getBoundingClientRect();
        if (!r.width || !r.height || r.width > MAGNET_W || r.height > MAGNET_H) return null;   // bade cards ko nahi kheechte
        return r;
    }
    function setState(next) {
        if (next === state) return;
        state = next;
        html.classList.remove('cc-hover', 'cc-text', 'cc-no', 'cc-pause', 'cc-range', 'cc-player');
        if (next) html.classList.add(next);
    }
    function show() { if (!live) { live = true; html.classList.add('cc-live', 'cc-on'); log('live'); } }
    function applyMagnet(rect) {
        var want = rect ? true : false;
        if (want) {
            var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            var ox = (cx - x) * MAGNET_STRENGTH, oy = (cy - y) * MAGNET_STRENGTH;
            mx = Math.max(-MAGNET_MAX, Math.min(MAGNET_MAX, ox));
            my = Math.max(-MAGNET_MAX, Math.min(MAGNET_MAX, oy));
        } else { mx = 0; my = 0; }
        if (want !== magnetOn) { magnetOn = want; html.classList.toggle('cc-magnet', want); }
    }
    function frame() {
        var tx = x + mx, ty = y + my;
        var dx = tx - rx, dy = ty - ry;
        if (reduce || (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1)) {
            rx = tx; ry = ty;
            ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0)';
            raf = null;                                   // settle ho gaya -> loop band (battery bachao)
            return;
        }
        rx += dx * 0.18; ry += dy * 0.18;
        ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0)';
        raf = requestAnimationFrame(frame);
    }

    document.addEventListener('mousemove', function (e) {
        x = e.clientX; y = e.clientY;
        dot.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';   // dot turant
        show();
        if (html.classList.contains('cc-typing')) html.classList.remove('cc-typing');
        if (e.target !== lastTarget) { lastTarget = e.target; setState(stateFor(e.target)); }
        applyMagnet(state === 'cc-hover' ? magnetFor(e.target) : null);   // magnet sirf hover state me
        if (raf === null) raf = requestAnimationFrame(frame);
    }, { passive: true });

    document.addEventListener('mousedown', function () {
        if (reduce) return;
        ring.classList.remove('cc-pop');
        void ring.offsetWidth;                            // animation restart
        ring.classList.add('cc-pop');
        dot.style.setProperty('--sx', 1.9);
        dot.style.setProperty('--sy', 1.9);
        setTimeout(function () { dot.style.removeProperty('--sx'); dot.style.removeProperty('--sy'); }, 170);
    }, { passive: true });

    /* Typing auto-hide: input me type karte waqt custom cursor fade (caret saaf dikhe) */
    document.addEventListener('keydown', function () {
        var ae = document.activeElement;
        if (ae && ae.closest && ae.closest(TEXT)) {
            html.classList.add('cc-typing');
            mx = 0; my = 0; magnetOn = false; html.classList.remove('cc-magnet');
        }
    }, true);

    /* Scroll par element ki rect badal jati hai -> magnet reset (agle mousemove par dobara calculate) */
    window.addEventListener('scroll', function () {
        mx = 0; my = 0; magnetOn = false; html.classList.remove('cc-magnet');
    }, { passive: true });

    /* pointer window se bahar, tab hidden, ya fullscreen video -> custom cursor hata do
       (fullscreen me sirf fullscreen element render hota hai, warna cursor poori tarah gayab lagta hai) */
    function pause(on) { html.classList.toggle('cc-pause', !!on); if (!on && live) setState(stateFor(lastTarget)); }
    document.addEventListener('mouseleave', function () { pause(true); }, { passive: true });
    document.addEventListener('mouseenter', function () { pause(false); }, { passive: true });
    window.addEventListener('blur', function () { pause(true); });
    document.addEventListener('visibilitychange', function () { pause(document.hidden); });
    document.addEventListener('fullscreenchange', function () {
        if (document.fullscreenElement) { html.classList.remove('cc-on'); pause(true); }
        else { html.classList.add('cc-on'); pause(false); }
    });
})();
</script>
{# CINE-CURSOR:HTML:END #}
{% endif %}
